[average]
Signal=getData(\":pwr\" ?result \"tran\")
continuous=yes

[delay]
Edge%20Number%201=1
Edge%20Number%202=1
Edge%20Type%201=falling
Edge%20Type%202=rising
Number%20of%20occurrences=single
Periodicity%201=1
Periodicity%202=1
Plot\print%20vs.=trigger
Signal1=VT(\"/Vctrl\")
Signal2=VT(\"/Vosc\")
Start%201=0.0
Start%202=nil
Start%202%20relative%20to=time
Stop=nil
Threshold%20Value%201=0.6
Threshold%20Value%202=0.6
Tolerance%201=nil
Tolerance%202=nil

[dutyCycle]
Output%20Type=plot
Plot\print%20vs.=time
Waveform=riseTime(VT(\"/Vosc\") 0 nil 0 nil 10 90 nil \"time\" )
mode=auto
threshold=0.0

[fallTime]
Final%20Value=0
Final%20Value%20Type=y
Initial%20Value=0
Initial%20Value%20Type=y
Number%20of%20occurrences=single
Percent%20High=10
Percent%20Low=90
Plot\print%20vs.=time
Signal=fallTime(VT(\"/Vosc\") 0 nil 0 nil 10 90 nil \"time\" )

[period_jitter]
Bin%20Size=0
Cross%20Type=falling
Output%20Type=plot
Plot\print%20vs.=time
Threshold=0.0
Waveform=VT(\"/Vosc\")
mode=auto

[riseTime]
Final%20Value=0
Final%20Value%20Type=y
Initial%20Value=0
Initial%20Value%20Type=y
Number%20of%20occurrences=single
Percent%20High=90
Percent%20Low=10
Plot\print%20vs.=time
Signal=VT(\"/Vosc\")
